# KernelBench Level 2 optimization subset used for the invariants ablation.
run_dir = "data/traces/kernelbench_optimization_level2"
num_workers = 8

[dataset]
source = "huggingface"
name = "ScalingIntelligence/KernelBench"
level = 2
subset = [1, 100]
problem_ids = [
  9, 12, 14, 18, 22, 29, 30, 33, 37, 39,
  40, 45, 51, 53, 55, 56, 59, 62, 63, 64,
  66, 68, 70, 75, 76, 80, 81, 84, 86, 88,
  94, 95, 97, 98, 99,
]

[codex]
timeout_seconds = 3000
max_retries = 3
bypass_approvals_and_sandbox = true
save_trajectory = true
config_overrides = []

[evaluation]
gpu_ids = [0, 1, 2, 3, 4, 5, 6, 7]
precision = "bf16"
num_correct_trials = 5
num_perf_trials = 100
gpu_arch = "gfx942"
