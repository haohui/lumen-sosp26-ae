# Backend and precision in particular are required for evaluating your kernels.
# Hardware_info information must also be defined if you use any of the hardware 
# templates.

# Order the components for the prompt in whatever way you want and use any
# created templates you want
components = [
    "custom_problem_statement",
    "problem_statement",
    "hardware_header",
    "hardware_specs",
    "hardware_best_practices",
    "arch_block",
    "precision_note",
    "examples_block",
    "instruction",
]

[custom_prompts.substrate_amd_full]
components = [
    "substrate_introduction",
    "substrate_syntax_guide",
    "arch_block",
    "substrate_constraints",
    "precision_note",
    "instruction",
]

# -------------------------------------------------------------------------
# Substrate-specific Templates
# -------------------------------------------------------------------------
[templates.substrate]

substrate_introduction = """
You are writing GPU kernels with the Substrate DSL.
Substrate DSL is a tile-based DSL for high-performance GPU kernels, syntactically close to Triton/PyCuTe and exposing low-level AMD features such as MFMA and explicit synchronization.

Treat Substrate as a PyCuTe-like kernel programming model with its own DSL syntax and AMD-oriented primitives.
The primary deliverable is a real GPU kernel implementation in Substrate DSL, not a pure PyTorch operator replacement.
Kernel launch configuration, memory hierarchy usage, and tile-level mapping should be explicitly expressed in the generated code.

Below is a reference `Model` / `ModelNew` pattern in Substrate DSL.
You will receive a `input_model.py` architecture below, and you must output an optimized `output_model_new.py`.
Use this structure as guidance and optimize the target architecture into a correct and runnable `ModelNew`.
"""

substrate_syntax_guide = """
## Substrate DSL Syntax and Examples

Here is a complete example showing how to write a Substrate DSL kernel:

**Example: Element-wise Addition**

Input PyTorch model:
```python
import torch
import torch.nn as nn

class Model(nn.Module):
    def __init__(self) -> None:
        super().__init__()

    def forward(self, a, b):
        return a + b
```

Optimized Substrate DSL kernel:
```python
import torch
import torch.nn as nn
import substrate
import substrate.language as S

@substrate.jit
def add_kernel(
    a: S.Tensor((1, 128), S.f32),
    b: S.Tensor((1, 128), S.f32),
    out: S.Tensor((1, 128), S.f32),
):
    tid = S.thread_id(0)
    if tid < 128:
        out[0, tid] = a[0, tid] + b[0, tid]

def substrate_add(a: torch.Tensor, b: torch.Tensor) -> torch.Tensor:
    assert a.is_cuda and b.is_cuda, "Tensors must be on CUDA/HIP device."
    assert a.shape == (1, 128) and b.shape == (1, 128), "Example kernel expects shape (1, 128)."

    out = torch.empty_like(a)
    add_kernel[lambda: ((1, 1, 1), (128, 1, 1))](a, b, out)
    return out

class ModelNew(nn.Module):
    def __init__(self) -> None:
        super().__init__()

    def forward(self, a, b):
        return substrate_add(a, b)
```
"""

substrate_constraints = """
## Substrate DSL Critical Requirements

**Kernel Definition Requirements:**
- ALL `@substrate.jit` kernel functions **must** be defined at **module top-level** — never nested inside other functions or classes.
- Substrate compiles kernels at import time; runtime definition is not supported.

**Memory and Data Handling:**
- Use `S.Pointer(S.dtype)` for runtime-shaped buffers, then create tensor views with `S.make_tensor(pointer, dtype, layout)`.
- Use `S.make_shared((shape), dtype)` for shared memory buffers with proper synchronization.
- Use `S.range()` for device-side loops, never Python's `range()`.
- Use explicit type conversions: `S.convert(value, S.f32)` for dtype changes.

**Launch Configuration:**
- Kernel launch syntax: `kernel[lambda: ((grid_x, grid_y, grid_z), (block_x, block_y, block_z))](args...)`
- For BF16 precision: use BF16 computation with FP32 accumulation for numerical stability.

**Implementation Requirements:**
- Preserve the exact semantics of the target `Model.forward` in the provided `model.py`.
- Keep input/output contracts compatible with `get_inputs()` and `get_init_inputs()` from the target problem.
- Do not provide a pure PyTorch eager implementation.
- Do not route final outputs through torch fallback paths (for example `torch.matmul`, `torch.mm`, `torch.bmm`, `torch.Conv2d`, or equivalent eager compute).
"""
