[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-artifact"
version = "0.1.0"
description = "Artifact evaluation repository for Lumen"
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools.package-dir]
"" = "python"

[project.optional-dependencies]
eval = [
    "aiter==0.1.10",
]
dev = [
    "ruff>=0.11.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
