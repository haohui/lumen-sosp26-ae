[build-system]
requires = [
    "setuptools>=69",
    "wheel",
    "pybind11>=2.11",
]
build-backend = "setuptools.build_meta"

[project]
name = "hipkittens"
version = "0.1.0"
description = "Python bindings for pinned HIPKittens BF16 GEMM kernels"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
