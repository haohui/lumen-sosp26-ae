[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-artifact"
version = "0.1.0"
description = "Artifact evaluation repository for Lumen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lumen-codex-run = "lumen.tools.cli.codex_runner:main"
lumen-kernelbench-generate = "lumen.tools.cli.kernelbench_generate:main"
lumen-kernelbench-graph-eval = "lumen.tools.cli.kernelbench_graph_eval:main"
lumen-kb-generation-metrics = "lumen.tools.cli.kb_generation_metrics_reporter:main"

[tool.setuptools.package-dir]
"" = "python"

[project.optional-dependencies]
eval = [
    "aiter==0.1.10",
]
dev = [
    "ruff>=0.11.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
