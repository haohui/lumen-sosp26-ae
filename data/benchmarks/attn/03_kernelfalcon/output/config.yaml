strategy: beam_search
num_workers: 1
strategy_config:
  num_top_kernels: 1
  num_bottlenecks: 1
openai_model: gpt-5.3-codex
high_reasoning_effort: false
benchmark_warmup: 25
benchmark_repeat: 100
divergence_threshold: 50.0
target_platform: cuda
gpu_name: "AMD Instinct MI300X"
bottleneck_override: compute
platform:
  verifier: nvidia
  benchmarker: nvidia
  worker_runner: nvidia
  specs_provider: nvidia
  profiler: nvidia
  roofline_analyzer: nvidia
  bottleneck_analyzer: nvidia
  rag_prescriber: noop
